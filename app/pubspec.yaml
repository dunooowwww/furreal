name: furreal
description: "furreal — koleksi hewan & peliharaan dengan ritme harian."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  camera: ^0.12.1
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_fonts: ^8.0.0
  image_picker: ^1.2.4
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
